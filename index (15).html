<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menafit</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#14181B;
  --surface:#1D2226;
  --surface-2:#242A2F;
  --border:#2C3439;
  --text:#ECE9E2;
  --text-muted:#8B949B;
  --amber:#E7A93E;
  --amber-dim:#4A3B21;
  --teal:#5B9C8F;
  --teal-dim:#243330;
  --clay:#C15B43;
  --clay-dim:#3A2621;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0;}
.brand{font-size:34px;letter-spacing:0.5px;color:var(--text);}
.brand span{color:var(--amber);}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
input,textarea,select{font-family:'Inter',sans-serif;}

/* header */
.header{padding:22px 18px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);}
.avatar-wrap{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--surface-2);border:2px solid var(--amber);flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.avatar-wrap img,.avatar-wrap video{width:100%;height:100%;object-fit:cover;}
.avatar-wrap .plus{color:var(--text-muted);font-size:22px;}
.avatar-input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.header-text{flex:1;}
.header-role{color:var(--text-muted);font-size:13px;margin-top:2px;}

/* sections */
.section{padding:18px;}
.section-title{font-size:15px;color:var(--text-muted);font-weight:600;margin-bottom:10px;letter-spacing:0.2px;}

/* resultados reales */
.results-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.result-card{flex-shrink:0;width:150px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.result-imgs{display:flex;height:110px;}
.result-imgs img{width:50%;height:100%;object-fit:cover;}
.result-name{padding:8px 10px;font-size:13px;font-weight:600;}
.result-empty{color:var(--text-muted);font-size:13px;padding:14px 0;}

/* status tabs */
.tabs{display:flex;gap:8px;padding:0 18px 14px;}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}
.tab.active-activos{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
.tab.active-inscritos{background:var(--teal-dim);color:var(--teal);border-color:var(--teal);}
.tab.active-vencidos{background:var(--clay-dim);color:var(--clay);border-color:var(--clay);}

/* client list */
.client-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:0 18px 10px;}
.client-thumb{width:46px;height:46px;border-radius:50%;background:var(--surface-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:700;}
.client-thumb img{width:100%;height:100%;object-fit:cover;}
.client-info{flex:1;min-width:0;}
.client-name{font-weight:600;font-size:15px;}
.client-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-activos{background:var(--amber);} .dot-inscritos{background:var(--teal);} .dot-vencidos{background:var(--clay);}
.empty-state{color:var(--text-muted);font-size:14px;padding:20px 18px;text-align:center;}

/* buttons */
.btn-primary{background:var(--amber);color:#1A1508;font-weight:700;padding:13px 16px;border-radius:12px;font-size:14px;width:100%;}
.btn-secondary{background:var(--surface-2);color:var(--text);font-weight:600;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;}
.fab-row{padding:6px 18px 18px;}

/* link boxes */
.link-box{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;}
.link-box span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--teal);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal-overlay.center{align-items:center;}
.modal-box{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px;border-top:1px solid var(--border);}
.modal-overlay.center .modal-box{border-radius:18px;max-height:82vh;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.icon-btn{background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;}

/* form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;}
.field textarea{resize:vertical;min-height:50px;}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;}

/* detail top */
.detail-header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;}
.back-btn{background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-name{font-size:22px;}
.status-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px;}
.pill-activos{background:var(--amber-dim);color:var(--amber);} .pill-inscritos{background:var(--teal-dim);color:var(--teal);} .pill-vencidos{background:var(--clay-dim);color:var(--clay);}

.detail-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 18px;}
.dtab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;}
.dtab.active{color:var(--amber);border-bottom-color:var(--amber);}

/* macro cards */
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.macro-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
.macro-val{font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.macro-label{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* chart */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}

/* day pills */
.day-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;}
.day-pill{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-muted);}
.day-pill.active{background:var(--amber);color:#1A1508;border-color:var(--amber);}

/* meal card */
.meal-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 18px 10px;}
.meal-title{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px;}
.meal-card textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:13px;resize:none;padding:0;min-height:34px;}

/* exercise item */
.exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 18px 10px;}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-weight:700;font-size:14px;}
.ex-actions{display:flex;gap:6px;flex-shrink:0;}
.mini-icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.ex-stats{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
.ex-stats b{color:var(--text);}
.ex-media{margin-top:10px;}
.ex-media img,.ex-media video{width:100%;max-height:160px;border-radius:8px;object-fit:cover;}
.pdf-preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;height:280px;}
.pdf-preview iframe{width:100%;height:100%;border:none;background:#fff;}
.sets-table{margin-top:10px;}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.set-row-public{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.set-checkbox{width:24px;height:24px;flex-shrink:0;accent-color:var(--amber);}
.set-num{font-size:12px;font-weight:700;color:var(--text);width:56px;flex-shrink:0;}
.set-detail{font-size:12px;color:var(--text-muted);}
.btn-timer{background:var(--amber-dim);color:var(--amber);font-weight:700;padding:8px 14px;border-radius:10px;font-size:13px;}
.btn-timer-sm{background:var(--amber-dim);color:var(--amber);font-weight:700;padding:5px 10px;border-radius:8px;font-size:12px;margin-left:auto;}
.timer-display{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--amber);background:var(--surface-2);padding:4px 14px;border-radius:10px;display:inline-flex;}
.timer-display-sm{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--amber);background:var(--surface-2);padding:3px 10px;border-radius:8px;margin-left:auto;}
.media-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);margin-top:8px;position:relative;background:transparent;padding:6px 0;}
.overlay-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.visually-hidden-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* muscle group tabs (library) */
.mg-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;}
.mg-pill{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);}
.mg-pill.active{background:var(--teal-dim);color:var(--teal);border-color:var(--teal);}
.lib-ex-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
.lib-add{width:30px;height:30px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:18px;display:flex;align-items:center;justify-content:center;}

/* photo slots */
.photo-slots{display:flex;gap:12px;padding:0 18px 18px;}
.photo-slot{flex:1;aspect-ratio:3/4;background:var(--surface);border:1px dashed var(--border);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;gap:6px;}
.photo-slot img,.photo-slot video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2;}
.photo-slot-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.55);padding:2px 8px;border-radius:8px;font-size:11px;z-index:1;font-weight:600;}

.note-banner{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);margin:0 18px 14px;line-height:1.5;}
.link-summary-section{margin-bottom:18px;}
.link-summary-title{font-size:14px;color:var(--amber);font-weight:700;margin-bottom:8px;}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:12px;font-size:13px;z-index:100;max-width:90%;box-shadow:0 6px 18px rgba(0,0,0,0.4);}

/* spinner */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);border-top-color:var(--amber);border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-primary:disabled,.btn-secondary:disabled{opacity:0.6;cursor:default;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---------------- data ---------------- */
const EXERCISE_LIBRARY_SEED = {
  "Pecho": ["Press banca plano","Press banca inclinado","Press banca declinado","Aperturas con mancuerna","Press con mancuernas","Fondos en paralelas","Flexiones de pecho","Cruce de poleas","Pull-over con mancuerna","Press en máquina Smith"],
  "Espalda": ["Dominadas","Remo con barra","Remo con mancuerna","Jalón al pecho","Remo en polea baja","Peso muerto","Pull-over en polea","Remo en máquina","Hiperextensiones","Face pull"],
  "Piernas": ["Sentadilla libre","Prensa de piernas","Zancadas","Sentadilla búlgara","Extensión de cuádriceps","Curl femoral","Peso muerto rumano","Sentadilla goblet","Elevación de talones","Hip thrust"],
  "Hombros": ["Press militar","Press con mancuernas","Elevaciones laterales","Elevaciones frontales","Pájaro (posterior)","Press Arnold","Remo al mentón","Face pull","Encogimientos de hombros","Press en máquina"],
  "Bíceps": ["Curl con barra","Curl con mancuernas","Curl martillo","Curl concentrado","Curl banco Scott","Curl en polea","Curl 21","Curl inclinado","Curl con banda","Curl spider"],
  "Tríceps": ["Press francés","Extensión en polea","Fondos entre bancos","Patada de tríceps","Press cerrado","Extensión sobre cabeza","Extensión con cuerda","Press en máquina","Fondos en paralelas","Kickback con mancuerna"],
  "Abdomen": ["Crunch abdominal","Plancha","Elevación de piernas","Abdominal en polea","Rueda abdominal","Bicicleta abdominal","Oblicuos con mancuerna","Plancha lateral","Mountain climbers","Abdominal en máquina"],
  "Glúteos": ["Hip thrust","Patada de glúteo","Puente de glúteo","Sentadilla sumo","Abducción de cadera","Zancada glútea","Peso muerto sumo","Step up","Patada trasera en polea","Puente a una pierna"]
};
const MUSCLE_GROUPS = Object.keys(EXERCISE_LIBRARY_SEED);
const GROUP_COLORS = {"Pecho":"#E7A93E","Espalda":"#5B9C8F","Piernas":"#C15B43","Hombros":"#8B79D9","Bíceps":"#4FA3D1","Tríceps":"#D14F8F","Abdomen":"#7FBF6A","Glúteos":"#D9A441","Movilidad articular":"#9B8AD4","Calentamiento":"#E86A5C"};
const CATEGORIAS_ESPECIALES = ["Movilidad articular","Calentamiento"];
function gruposNormales(){
  return [...MUSCLE_GROUPS, ...state.customCategories.filter(c=>c.tipo==="normal").map(c=>c.nombre)];
}
function categoriasEspeciales(){
  return [...CATEGORIAS_ESPECIALES, ...state.customCategories.filter(c=>c.tipo==="especial").map(c=>c.nombre)];
}
function defaultIconSVG(grupo){
  const color = GROUP_COLORS[grupo] || "#8B949B";
  const label = (grupo||"EJ").slice(0,2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="16" fill="${color}"/><text x="50" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#14181B" text-anchor="middle">${label}</text></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
function buildSeedLibrary(){
  const lib={};
  MUSCLE_GROUPS.forEach(g=>{
    lib[g]=EXERCISE_LIBRARY_SEED[g].map(nombre=>({id:uid(), nombre, media:null, mediaType:null}));
  });
  return lib;
}
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MEALS = ["Desayuno","Media mañana","Almuerzo","Media tarde","Cena"];
const MEAL_SPLIT = {"Desayuno":0.25,"Media mañana":0.10,"Almuerzo":0.30,"Media tarde":0.10,"Cena":0.25};

/* ---------------- enrutamiento por link (vista del cliente) ---------------- */
const urlParams = new URLSearchParams(window.location.search);
const ROUTE_CLIENT_ID = urlParams.get('c');
const ROUTE_VIEW = urlParams.get('v') || 'plan';
function appUrl(clientId, view){
  return location.origin + location.pathname + "?c=" + clientId + "&v=" + view;
}

function emptyWeekPlan(fillFn){
  const o={};
  DAYS.forEach(d=>{ o[d]=fillFn?fillFn():{}; });
  return o;
}
function emptyTrainingWeek(){
  const o={};
  DAYS.forEach(d=> o[d]=[]);
  return o;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------- fechas de mensualidad ---------------- */
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function sumarDias(fechaISO, dias){
  const d = new Date(fechaISO+"T00:00:00");
  d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}
function diasEntre(fechaISO){
  const hoy = new Date(hoyISO()+"T00:00:00");
  const otra = new Date(fechaISO+"T00:00:00");
  return Math.round((otra-hoy)/(1000*60*60*24));
}
function formatoFecha(fechaISO){
  if(!fechaISO) return "—";
  const [y,m,d] = fechaISO.split("-");
  return d+"/"+m+"/"+y;
}

/* ---------------------------------------------------------------
   Almacenamiento persistente REAL en la nube (Firebase Firestore).
   Ya no depende del navegador ni del celular: los datos viven en
   internet, así que se puede acceder a ellos desde cualquier
   dispositivo con este mismo archivo/link.
------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyBQjL8TPnDLlXM4T2kiCFDxg-dGn40f_W4",
  authDomain: "menapit-77c5b.firebaseapp.com",
  projectId: "menapit-77c5b",
  storageBucket: "menapit-77c5b.firebasestorage.app",
  messagingSenderId: "134030608307",
  appId: "1:134030608307:web:dc6455a177a96ba69a2dc6"
};
let db = null;
let firebaseListo = false;
function intentarConectarFirebase(){
  try{
    if(typeof firebase === "undefined") return false;
    if(!firebase.apps || firebase.apps.length===0) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseListo = true;
    return true;
  }catch(e){ return false; }
}
intentarConectarFirebase();

function conTiempoLimite(promesa, ms){
  return Promise.race([
    promesa,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("tiempo agotado")), ms))
  ]);
}

const storage = {
  async get(key){
    if(!firebaseListo && !intentarConectarFirebase()) return null;
    try{
      const snap = await conTiempoLimite(db.collection("menapi").doc(key).get(), 5000);
      if(!snap.exists) return null;
      return {key, value: snap.data().value};
    }catch(e){ return null; }
  },
  async set(key, value){
    if(!firebaseListo && !intentarConectarFirebase()){ showToast("Sin conexión con la base de datos, este cambio no se guardó."); return null; }
    try{
      await conTiempoLimite(db.collection("menapi").doc(key).set({value}), 5000);
      return {key, value};
    }catch(e){ return null; }
  },
  async delete(key){
    if(!firebaseListo && !intentarConectarFirebase()) return null;
    try{ await conTiempoLimite(db.collection("menapi").doc(key).delete(), 5000); return {key, deleted:true}; }
    catch(e){ return null; }
  }
};

function calcMacros(f){
  const peso=parseFloat(f.peso)||70, estatura=parseFloat(f.estatura)||170, edad=parseFloat(f.edad)||30;
  let bmrRaw = f.sexo==="mujer" ? (10*peso+6.25*estatura-5*edad-161) : (10*peso+6.25*estatura-5*edad+5);
  const bmr = Math.round(bmrRaw);
  const freq = parseInt(f.frecuencia)||3;
  const factor = freq<=2 ? 1.375 : (freq<=4 ? 1.55 : 1.725);
  const mantenimiento = Math.round(bmr*factor);
  let objetivoFactor = 1;
  if(f.objetivo==="bajar") objetivoFactor = 0.8;
  else if(f.objetivo==="ganar") objetivoFactor = 1.12;
  const calorias = Math.round(mantenimiento*objetivoFactor);
  const proteina = Math.round(peso*2);
  const grasas = Math.round((calorias*0.25)/9);
  const kcalRestantes = calorias - (proteina*4) - (grasas*9);
  const carbohidratos = Math.max(0, Math.round(kcalRestantes/4));
  const proteinaPct = Math.round((proteina*4/calorias)*100);
  const grasasPct = Math.round((grasas*9/calorias)*100);
  const carbosPct = Math.round((carbohidratos*4/calorias)*100);
  return {bmr, calorias, mantenimiento, proteina, grasas, carbohidratos, proteinaPct, grasasPct, carbosPct};
}

function objetivoLabel(o){
  if(o==="bajar") return "Bajar de peso";
  if(o==="ganar") return "Ganar masa muscular";
  return "Mantener peso";
}

function generateMealPlanFallback(macros){
  return emptyWeekPlan(()=>{
    const day={};
    MEALS.forEach(m=>{
      const pct=MEAL_SPLIT[m];
      const kcal=Math.round(macros.calorias*pct);
      const prot=Math.round(macros.proteina*pct);
      const carb=Math.round(macros.carbohidratos*pct);
      const gras=Math.round(macros.grasas*pct);
      day[m] = `~${kcal} kcal · ${prot}g proteína / ${carb}g carbohidratos / ${gras}g grasas. Sugerencia: fuente de proteína magra + carbohidrato complejo + vegetales.`;
    });
    return day;
  });
}

async function generateMealPlanAI(ficha, macros){
  const prompt = `Eres un nutricionista práctico. Crea un plan de alimentación semanal (Lunes a Domingo) para esta persona:
Edad: ${ficha.edad}, sexo: ${ficha.sexo}, peso: ${ficha.peso} kg, estatura: ${ficha.estatura} cm, frecuencia de entrenamiento: ${ficha.frecuencia} veces/semana, nivel: ${ficha.nivel}, condición médica: ${ficha.condicion||"ninguna"}.
Objetivo de la persona: ${objetivoLabel(ficha.objetivo)}.
Meta nutricional diaria: ${macros.calorias} kcal, ${macros.proteina}g proteína, ${macros.carbohidratos}g carbohidratos, ${macros.grasas}g grasas.

Reglas:
- El plan debe ayudar a cumplir el objetivo indicado (si es bajar de peso, prioriza saciedad con pocas calorías; si es ganar masa muscular, asegura suficiente proteína y energía en cada comida; si es mantener, equilibrio general).
- Comidas económicas, con ingredientes fáciles de conseguir en un mercado local.
- Preparación simple, sin técnicas complicadas.
- Lenguaje claro y directo, sin tecnicismos.
- Varía las comidas entre los días para que no se repita todo igual.
- Si hay una condición médica, respétala (evita ingredientes contraindicados).
- Cada comida debe indicar brevemente qué incluye y una referencia aproximada de calorías.

Responde ÚNICAMENTE con un JSON válido, sin texto adicional, sin marcadores de código, con esta forma exacta:
{"Lunes":{"Desayuno":"texto","Media mañana":"texto","Almuerzo":"texto","Media tarde":"texto","Cena":"texto"},"Martes":{...},"Miércoles":{...},"Jueves":{...},"Viernes":{...},"Sábado":{...},"Domingo":{...}}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:3000,
      messages:[{role:"user", content:prompt}]
    })
  });
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||"").join("");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean);
  DAYS.forEach(d=>{
    if(!parsed[d]) throw new Error("respuesta incompleta");
    MEALS.forEach(m=>{ if(!parsed[d][m]) parsed[d][m]=""; });
  });
  return parsed;
}

/* ---------------- temporizador de descanso entre series ---------------- */
const timerState = {};
function iniciarDescanso(key, segundos){
  if(!timerState[key]) timerState[key] = {};
  const t = timerState[key];
  if(t.interval) return;
  t.remaining = segundos;
  const btn = document.getElementById('btn-descanso-'+key);
  const disp = document.getElementById('disp-descanso-'+key);
  if(btn) btn.style.display='none';
  if(disp) disp.style.display='inline-flex';
  actualizarDescansoDisplay(key);
  t.interval = setInterval(()=>{
    t.remaining--;
    actualizarDescansoDisplay(key);
    if(t.remaining<=0){
      clearInterval(t.interval);
      t.interval=null;
      avisarDescansoTerminado();
      if(btn) btn.style.display='inline-flex';
      if(disp) disp.style.display='none';
    }
  },1000);
}
function actualizarDescansoDisplay(key){
  const disp = document.getElementById('disp-descanso-'+key);
  const t = timerState[key];
  if(disp && t){
    const mm=String(Math.floor(Math.max(t.remaining,0)/60)).padStart(2,'0');
    const ss=String(Math.max(t.remaining,0)%60).padStart(2,'0');
    disp.textContent = mm+':'+ss;
  }
}
function avisarDescansoTerminado(){
  try{ if(navigator.vibrate) navigator.vibrate([300,100,300]); }catch(e){}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    o.frequency.value = 880;
    o.connect(ctx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 400);
  }catch(e){}
}

const MAX_VIDEO_BYTES = 500*1024; // Firestore permite máx. ~1MB por registro; los videos no se comprimen, así que el margen real es muy chico
const MAX_OUTPUT_DATAURL_CHARS = 850*1024; // margen de seguridad bajo el límite de 1MB por documento de Firestore

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("no se pudo leer la imagen"));
    reader.onload=()=>{
      img.onerror=()=>reject(new Error("imagen inválida"));
      img.onload=()=>{
        let w=img.width, h=img.height;
        const maxSide=800;
        if(w>maxSide || h>maxSide){
          if(w>h){ h=Math.round(h*(maxSide/w)); w=maxSide; }
          else{ w=Math.round(w*(maxSide/h)); h=maxSide; }
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        let quality=0.75, out=canvas.toDataURL("image/jpeg", quality);
        while(out.length>MAX_OUTPUT_DATAURL_CHARS && quality>0.25){
          quality-=0.1;
          out=canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function fileToDataUrlChecked(file, cb){
  const isVideo = file.type.startsWith("video");
  const isGif = file.type === "image/gif";
  if(isVideo || isGif){
    if(file.size > MAX_VIDEO_BYTES){
      showToast(isGif
        ? "Ese GIF pesa demasiado para guardarse (máx. ~"+Math.round(MAX_VIDEO_BYTES/1024)+"KB). Prueba con uno más corto o una imagen fija."
        : "Los videos todavía no caben en el almacenamiento actual (máx. ~"+Math.round(MAX_VIDEO_BYTES/1024)+"KB, muy poco para un video real). Usa una foto por ahora — para videos necesitamos activar otro almacenamiento más adelante.");
      return;
    }
    fileToDataUrl(file, (url)=>cb(url, isGif ? "image" : "video"));
  }else{
    compressImage(file).then(dataUrl=>cb(dataUrl,"image"))
      .catch(()=>showToast("No se pudo procesar esa imagen, intenta con otra."));
  }
}

function getClient(id){ return state.clients.find(c=>c.id===id); }
function fileToDataUrl(file, cb){
  const reader=new FileReader();
  reader.onload=()=>cb(reader.result, file.type.startsWith("video")?"video":"image");
  reader.readAsDataURL(file);
}
function esc(s){ return String(s==null?"":s).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function pdfParaMostrar(c){
  if(!c.planPDF) return null;
  if(c._planPDFBlobUrl) return c._planPDFBlobUrl;
  try{
    const [header, base64] = c.planPDF.split(",");
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for(let i=0;i<binario.length;i++) bytes[i]=binario.charCodeAt(i);
    const blob = new Blob([bytes], {type:"application/pdf"});
    c._planPDFBlobUrl = URL.createObjectURL(blob);
    return c._planPDFBlobUrl;
  }catch(e){
    return c.planPDF; // si falla la conversión, se usa el original como respaldo
  }
}

    ${tieneEjercicios? `<div class="note-banner" style="margin:0 18px 12px;color:${cump&&cump.completo?'var(--amber)':'var(--text-muted)'};">${cump&&cump.completo? "✅ Entrenamiento de hoy marcado como cumplido" : `Marca cada serie a medida que la completes (${cump?cump.hechos:0}/${cump?cump.total:list.reduce((a,ex)=>a+(ex.sets?ex.sets.length:0),0)})`}</div>`:''}
    ${list.length? list.map((ex,exIdx)=> ex.tipo==="especial" ? `
      <div class="exercise-card">
        <div class="ex-name">${esc(ex.nombre)}</div>
        <div class="ex-media">${ex.media? (ex.mediaType==='video'?`<video src="${ex.media}" controls></video>`:`<img src="${ex.media}" onclick="abrirMediaCompleta(this.src,'image')" style="cursor:zoom-in;">`) : `<img src="${defaultIconSVG(ex.nombre)}">`}</div>
        ${ex.nota? `<div class="ex-stats" style="margin-top:8px;"><span>${esc(ex.nota)}</span></div>`:''}
      </div>
    ` : `
      <div class="exercise-card">
        <div class="ex-name">${esc(ex.nombre)}</div>
        <div class="ex-media">${ex.media? (ex.mediaType==='video'?`<video src="${ex.media}" controls></video>`:`<img src="${ex.media}" onclick="abrirMediaCompleta(this.src,'image')" style="cursor:zoom-in;">`) : `<img src="${defaultIconSVG(ex.grupo)}">`}</div>
        ${ex.nota? `<div class="ex-stats"><span>Nota: <b>${esc(ex.nota)}</b></span></div>`:''}
        <div class="sets-table">
          ${(ex.sets||[]).map((s,si)=>`
            <div class="set-row-public">
              <input type="checkbox" class="set-checkbox" ${s.hecho?'checked':''} onchange="marcarSerieHecha('${d}',${exIdx},${si},this.checked)">
              <span class="set-num">Serie ${si+1}</span>
              <span class="set-detail">${esc(s.reps||'—')} reps · ${esc(s.peso||'—')}</span>
              <button class="btn-timer-sm" id="btn-descanso-pub-${ex.instId}-${si}" onclick="iniciarDescanso('pub-${ex.instId}-${si}', ${parseInt(s.descanso)||60})">▶ ${s.descanso||60}s</button>
              <span class="timer-display-sm" id="disp-descanso-pub-${ex.instId}-${si}" style="display:none;">00:00</span>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("") : `<div class="empty-state">Día de descanso.</div>`}
    `;
  })()}
  `;
}
function actualizarCumplimientoDia(c, day){
  const ejercicios = (c.planEntrenamiento[day]||[]).filter(ex=>ex.tipo!=="especial" && ex.sets && ex.sets.length);
  const total = ejercicios.reduce((acc,ex)=>acc+ex.sets.length,0);
  const hechos = ejercicios.reduce((acc,ex)=>acc+ex.sets.filter(s=>s.hecho).length,0);
  if(!c.cumplimiento) c.cumplimiento={};
  c.cumplimiento[day] = { completo: total>0 && hechos===total, hechos, total, fecha: hoyISO() };
}
async function marcarSerieHecha(day, exIdx, si, checked){
  const c = state.publicClient;
  if(!c) return;
  const ex = c.planEntrenamiento[day][exIdx];
  if(!ex || !ex.sets || !ex.sets[si]) return;
  ex.sets[si].hecho = checked;
  actualizarCumplimientoDia(c, day);
  await persistClient(c);
  render();
}

  const c=getClient(id);

  render();
}

async function handlePlanPDF(e, clientId){
  const file=e.target.files[0]; if(!file) return;
  const MAX_PDF_BYTES = 700*1024;
  if(file.size > MAX_PDF_BYTES){
    showToast("Ese PDF pesa demasiado (máx. ~"+Math.round(MAX_PDF_BYTES/1024)+"KB). Prueba exportándolo sin imágenes pesadas.");
    return;
  }
  fileToDataUrl(file, async (url)=>{
    const c=getClient(clientId);
    c.planPDF = url;
    await persistMedia(clientId+":pdf", url, "pdf");
    persistClient(c);
    render();
  });
}

  const c=getClient(clientId);
  c.planPDF=null;
  await deleteMedia(clientId+":pdf");
  persistClient(c);

function normalizarEjercicio(ex){
  if(!ex.instId) ex.instId=uid();
  if(ex.tipo==="especial") return ex;
  if(!ex.sets || !ex.sets.length){
    const n = parseInt(ex.series)||3;
    const base = {reps: ex.reps||'', peso: ex.peso||'', descanso: parseInt(ex.descanso)||60, hecho:false};
    ex.sets = Array.from({length:n}, ()=>({...base}));
  }
  return ex;
}

function openModal(m){ state.modal=m; render(); }
function closeModal(){ state.modal=null; render(); }

function renderModal(){
  if(!state.modal) return "";
  const m=state.modal;
  if(m.type==="nuevoCliente") return modalNuevoCliente();
  if(m.type==="linkInscripcion") return modalLinkSimple("Link de inscripción", m.clientId, "inscripcion");
  if(m.type==="linkEntrenamiento") return modalLinkEntrenamiento(m.clientId);
  if(m.type==="nuevoPeso") return modalNuevoPeso(m.clientId);
  if(m.type==="libreria") return modalLibreria(m.clientId, m.day, m.mg);
  if(m.type==="editExercise") return modalEditExercise(m.clientId, m.day, m.index);
  if(m.type==="generando") return modalGenerando();
  if(m.type==="confirmarEliminar") return modalConfirmarEliminar(m.clientId);
  if(m.type==="editarFechaActivacion") return modalEditarFechaActivacion(m.clientId);
  if(m.type==="copiarEntrenamiento") return modalCopiarEntrenamiento(m.clientId);
  if(m.type==="confirmarCopiar") return modalConfirmarCopiar(m.clientId, m.origenId);
  if(m.type==="crearCategoria") return modalCrearCategoria(m.clientId, m.day);
  if(m.type==="confirmarEliminarCategoria") return modalConfirmarEliminarCategoria(m.nombre, m.clientId, m.day);
  if(m.type==="verMedia") return modalVerMedia(m.src, m.tipo);
  if(m.type==="mostrarLinkNuevo") return modalMostrarLinkNuevo(m.url);
  if(m.type==="cargando") return modalCargando();
  if(m.type==="gestionBiblioteca") return modalGestionBiblioteca(m.mg);
  if(m.type==="libRenombrar") return modalLibRenombrar(m.mg, m.exId);
  return "";
}

async function eliminarCliente(id){
  const c=getClient(id);
  if(!c) return;
  await deleteMedia(id+":foto:fotoAntes");
  await deleteMedia(id+":foto:fotoDespues");
  for(const d of DAYS){
    for(const ex of c.planEntrenamiento[d]){
      if(ex.instId) await deleteMedia(id+":ex:"+ex.instId);
    }
  }
  await deleteClientStorage(id);
  state.clients = state.clients.filter(x=>x.id!==id);
  await persistClientIds();
  state.modal=null;
  state.view.screen="dashboard";
  render();
  showToast("Cliente eliminado.");

async function ejecutarCopiaEntrenamiento(clientId, origenId){
  const destino=getClient(clientId), origen=getClient(origenId);
  state.modal={type:"generando"};
  render();
  const nuevoPlan = {};
  for(const d of DAYS){
    nuevoPlan[d] = origen.planEntrenamiento[d].map(ex=>{
      const copia = JSON.parse(JSON.stringify(ex));
      copia.instId = uid();
      if(copia.sets) copia.sets = copia.sets.map(s=>({...s, hecho:false}));
      return copia;
    });
  }
  for(const d of DAYS){
    for(let i=0;i<origen.planEntrenamiento[d].length;i++){
      const exOrig = origen.planEntrenamiento[d][i];
      const exNuevo = nuevoPlan[d][i];
      if(exOrig.media){
        await persistMedia(destino.id+":ex:"+exNuevo.instId, exOrig.media, exOrig.mediaType);
      }
    }
  }
  destino.planEntrenamiento = nuevoPlan;
  await persistClient(destino);
  state.modal=null;
  render();
  showToast("Entrenamiento de "+origen.nombre+" copiado a "+destino.nombre+".");
}

async function crearCliente(){
  const g=id=>document.getElementById(id).value;
  const ficha={ nombre:g("f_nombre")||"Nuevo cliente", edad:g("f_edad"), sexo:g("f_sexo"), peso:g("f_peso"), estatura:g("f_estatura"), frecuencia:g("f_frecuencia"), nivel:g("f_nivel"), condicion:g("f_condicion") };
  const macros=calcMacros(ficha);

  state.modal={type:"generando"};
  render();

  let plan;
  try{
    plan = await generateMealPlanAI(ficha, macros);
  }catch(e){
    plan = generateMealPlanFallback(macros);
    showToast("La IA no respondió a tiempo, se generó un plan base. Puedes regenerarlo luego desde la ficha.");
  }

  const cliente={
    id:uid(), nombre:ficha.nombre, estado:"inscritos",
    ficha:{edad:ficha.edad,peso:ficha.peso,estatura:ficha.estatura,sexo:ficha.sexo,frecuencia:ficha.frecuencia,nivel:ficha.nivel,condicion:ficha.condicion},

    fotoAntes:null, fotoDespues:null,
    planAlimentacion: plan,
    planEntrenamiento: emptyTrainingWeek()
  };
  state.clients.push(cliente);
  await persistClient(cliente);
  await persistClientIds();
  state.modal=null;
  state.view.statusTab="inscritos";
  render();
}

}
function modalCrearCategoria(clientId, day){

      <div class="modal-header"><h3>Nueva categoría</h3><button class="icon-btn" onclick="openModal({type:'libreria', clientId:'${clientId}', day:'${day}', mg:'Pecho'})">${ICON.x}</button></div>
      <div class="field"><label>Nombre</label><input id="cc_nombre" placeholder="Ej: Estiramiento, Entrenamiento funcional, Crossfit, Cardio"></div>

async function crearCategoriaNueva(clientId, day){
  const nombre=(document.getElementById("cc_nombre").value||"").trim();
  const tipo=document.getElementById("cc_tipo").value;
  if(!nombre) return;
  if(gruposNormales().includes(nombre) || categoriasEspeciales().includes(nombre)){
    showToast("Ya existe una categoría con ese nombre.");
    return;
  }
  state.customCategories.push({nombre, tipo});
  if(tipo==="normal") state.library[nombre]=[];
  await persistCustomCategories();
  if(tipo==="normal") await persistLibraryMeta();
  openModal({type:"libreria", clientId, day, mg:nombre});
}
function modalConfirmarEliminarCategoria(nombre, clientId, day){
  return `
  <div class="modal-overlay center" onclick="if(event.target===this) closeModal()">
    <div class="modal-box" style="text-align:center;">
      <h3 style="margin-bottom:10px;">¿Eliminar "${esc(nombre)}"?</h3>
      <p style="font-size:13px;color:var(--text-muted);">Se borra la categoría y los ejercicios que hayas guardado ahí en la biblioteca. No afecta lo que ya agregaste a los días de tus clientes.</p>
      <div class="row2" style="margin-top:16px;">
        <button class="btn-secondary" style="flex:1" onclick="openModal({type:'libreria', clientId:'${clientId}', day:'${day}', mg:'Pecho'})">Cancelar</button>
        <button class="btn-secondary" style="flex:1;color:var(--clay);border-color:var(--clay);" onclick="eliminarCategoria('${nombre.replace(/'/g,"\\'")}','${clientId}','${day}')">Sí, eliminar</button>
      </div>
    </div>
  </div>`;
}
async function eliminarCategoria(nombre, clientId, day){
  state.customCategories = state.customCategories.filter(c=>c.nombre!==nombre);
  if(state.library[nombre]){
    for(const item of state.library[nombre]){
      if(item.media) await deleteMedia("lib:"+item.id);
    }
    delete state.library[nombre];
  }
  await persistCustomCategories();
  await persistLibraryMeta();
  openModal({type:"libreria", clientId, day, mg:"Pecho"});
  showToast("Categoría eliminada.");
}
function agregarBloqueEspecial(clientId, day, categoria){
  const c=getClient(clientId);
  const ex={instId:uid(), tipo:"especial", nombre:categoria, nota:"", media:null, mediaType:null};
  c.planEntrenamiento[day].push(ex);
  persistClient(c);
  closeModal();
}
function agregarEjercicio(clientId, day, exerciseId){
  const c=getClient(clientId);
  const grupo = Object.keys(state.library).find(g=>state.library[g].some(x=>x.id===exerciseId));
  const libItem = state.library[grupo].find(x=>x.id===exerciseId);
  const ex = {
    instId:uid(), nombre:libItem.nombre, grupo,
    sets:[{reps:'',peso:'',descanso:60,hecho:false},{reps:'',peso:'',descanso:60,hecho:false},{reps:'',peso:'',descanso:60,hecho:false}],
    nota:"", media:libItem.media||null, mediaType:libItem.mediaType||null
  };
  c.planEntrenamiento[day].push(ex);
  if(ex.media) persistMedia(c.id+":ex:"+ex.instId, ex.media, ex.mediaType);
  persistClient(c);
  closeModal();
}

async function libAgregarNuevo(mg){
  const input=document.getElementById("lib_nuevo_nombre");

}
async function libEliminar(mg,id){
  state.library[mg] = state.library[mg].filter(x=>x.id!==id);
  await deleteMedia("lib:"+id);
  await persistLibraryMeta();
  render();
}
function libRenombrarPrompt(mg,id){
  openModal({type:"libRenombrar", mg, exId:id});
}
async function libGuardarNombre(mg,id){
  const nuevo=document.getElementById("lr_nombre").value.trim();
  if(nuevo){
    const item=state.library[mg].find(x=>x.id===id);
    item.nombre=nuevo;

}
function libSetMedia(mg,id,e){
  const file=e.target.files[0]; if(!file) return;
  fileToDataUrlChecked(file,(url,type)=>{
    const item=state.library[mg].find(x=>x.id===id);
    item.media=url; item.mediaType=type;
    persistMedia("lib:"+id, url, type);
    persistLibraryMeta();
    render();
  });

  return `

function leerSetsDesdeFormulario(ex){
  const nuevos=[];
  for(let i=0;i<ex.sets.length;i++){
    const repsEl=document.getElementById('ee_reps_'+i);
    if(!repsEl) break;
    nuevos.push({
      reps: repsEl.value,
      peso: document.getElementById('ee_peso_'+i).value,
      descanso: document.getElementById('ee_descanso_'+i).value,
      hecho: ex.sets[i] ? !!ex.sets[i].hecho : false
    });
  }
  if(nuevos.length) ex.sets = nuevos;
  const notaEl = document.getElementById('ee_nota');
  if(notaEl) ex.nota = notaEl.value;
}
function agregarSerieModal(clientId, day, index){
  const ex=getClient(clientId).planEntrenamiento[day][index];
  leerSetsDesdeFormulario(ex);
  const ultima = ex.sets[ex.sets.length-1] || {reps:'',peso:'',descanso:60};
  ex.sets.push({...ultima, hecho:false});
  openModal({type:'editExercise', clientId, day, index});
}
function quitarSerieModal(clientId, day, index){
  const ex=getClient(clientId).planEntrenamiento[day][index];
  leerSetsDesdeFormulario(ex);
  if(ex.sets.length>1) ex.sets.pop();
  openModal({type:'editExercise', clientId, day, index});
}
function guardarEjercicio(clientId, day, index){
  const c=getClient(clientId);
  const ex=c.planEntrenamiento[day][index];
  leerSetsDesdeFormulario(ex);
  persistClient(c);
  closeModal();
}

  const macros = calcMacros(ficha);
  const c = {
    id:"demo1", nombre:"Valeria Ríos", estado:"activos",

    fechaActivacion: sumarDias(hoyISO(),-18), fechaVencimiento: sumarDias(hoyISO(),12),
    pesoHistorial:[{fecha:"01 Ago",peso:72},{fecha:"15 Ago",peso:70.5},{fecha:"01 Sep",peso:69},{fecha:"04 Sep",peso:68}],
    fotoAntes:null, fotoDespues:null,
    planAlimentacion: generateMealPlanFallback(macros),
    planEntrenamiento: emptyTrainingWeek()
  };
  state.clients.push(c);
  await persistClient(c);
  await persistClientIds();

async function initApp(){
  if(ROUTE_CLIENT_ID){
    try{
      const r = await storage.get("client:"+ROUTE_CLIENT_ID, false);
      if(r && r.value){
        const c = JSON.parse(r.value);
        const fa = await loadMedia(ROUTE_CLIENT_ID+":foto:fotoAntes"); if(fa) c.fotoAntes=fa.dataUrl;
        const fd = await loadMedia(ROUTE_CLIENT_ID+":foto:fotoDespues"); if(fd) c.fotoDespues=fd.dataUrl;
        const fp = await loadMedia(ROUTE_CLIENT_ID+":foto:fotoPerfil"); if(fp) c.fotoPerfil=fp.dataUrl;
        const pdf = await loadMedia(ROUTE_CLIENT_ID+":pdf"); if(pdf) c.planPDF=pdf.dataUrl;
        for(const d of DAYS){
          for(const ex of c.planEntrenamiento[d]){
            if(ex.instId){
              const em = await loadMedia(ROUTE_CLIENT_ID+":ex:"+ex.instId);
              if(em){ ex.media=em.dataUrl; ex.mediaType=em.mediaType; }
            }
          }
        }
        state.publicClient = c;
      }
    }catch(e){ /* cliente no encontrado */ }
    state.modal = null;
    render();
    return;
  }

  try{
    const trainerRes = await storage.get("trainer", false);
    if(trainerRes && trainerRes.value){
      const t=JSON.parse(trainerRes.value);
      state.trainer.name = t.name || state.trainer.name;
    }
  }catch(e){ /* sin perfil guardado aún */ }
  const trainerMedia = await loadMedia("trainer-avatar");
  if(trainerMedia){ state.trainer.media=trainerMedia.dataUrl; state.trainer.mediaType=trainerMedia.mediaType; }

  try{
    const ccRes = await storage.get("custom-categories", false);
    if(ccRes && ccRes.value) state.customCategories = JSON.parse(ccRes.value);
  }catch(e){ /* sin categorías personalizadas aún */ }

  try{
    const libRes = await storage.get("library", false);
    if(libRes && libRes.value){
      const meta = JSON.parse(libRes.value);
      for(const g of gruposNormales()){
        state.library[g] = [];
        for(const it of (meta[g]||[])){
          const entry = {id:it.id, nombre:it.nombre, media:null, mediaType:it.mediaType||null};
          if(it.hasMedia){
            const m = await loadMedia("lib:"+it.id);
            if(m) entry.media = m.dataUrl;
          }
          state.library[g].push(entry);
        }
      }
    }else{
      state.library = buildSeedLibrary();
      await persistLibraryMeta();
    }
  }catch(e){
    state.library = buildSeedLibrary();
  }

  let ids=[];
  try{
    const idsRes = await storage.get("client-ids", false);
    if(idsRes && idsRes.value) ids = JSON.parse(idsRes.value);
  }catch(e){ /* primera vez, sin clientes guardados */ }

  if(ids.length===0){
    await seedDemoClient();
  }else{
    for(const id of ids){
      try{
        const r = await storage.get("client:"+id, false);
        if(r && r.value){
          const c = JSON.parse(r.value);
          const fa = await loadMedia(id+":foto:fotoAntes"); if(fa) c.fotoAntes=fa.dataUrl;
          const fd = await loadMedia(id+":foto:fotoDespues"); if(fd) c.fotoDespues=fd.dataUrl;
          const fp = await loadMedia(id+":foto:fotoPerfil"); if(fp) c.fotoPerfil=fp.dataUrl;
          const pdf = await loadMedia(id+":pdf"); if(pdf) c.planPDF=pdf.dataUrl;
          for(const d of DAYS){
            for(const ex of c.planEntrenamiento[d]){
              if(ex.instId){
                const em = await loadMedia(id+":ex:"+ex.instId);
                if(em){ ex.media=em.dataUrl; ex.mediaType=em.mediaType; }
              }
            }
          }
          state.clients.push(c);
        }
      }catch(e){ /* ese cliente no se pudo cargar, se omite */ }
    }
  }

  revisarVencimientos();
  state.modal=null;
  render();
}

render();
initApp().catch(()=>{ /* cualquier error ya se maneja abajo con el vigilante */ });

setTimeout(()=>{
  const app = document.getElementById("app");

  }
});
