<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menapi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#14181B;
  --surface:#1D2226;
  --surface-2:#242A2F;
  --border:#2C3439;
  --text:#ECE9E2;
  --text-muted:#8B949B;
  --amber:#E7A93E;
  --amber-dim:#4A3B21;
  --teal:#5B9C8F;
  --teal-dim:#243330;
  --clay:#C15B43;
  --clay-dim:#3A2621;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0;}
.brand{font-size:34px;letter-spacing:0.5px;color:var(--text);}
.brand span{color:var(--amber);}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
input,textarea,select{font-family:'Inter',sans-serif;}

/* header */
.header{padding:22px 18px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);}
.avatar-wrap{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--surface-2);border:2px solid var(--amber);flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.avatar-wrap img,.avatar-wrap video{width:100%;height:100%;object-fit:cover;}
.avatar-wrap .plus{color:var(--text-muted);font-size:22px;}
.avatar-input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.header-text{flex:1;}
.header-role{color:var(--text-muted);font-size:13px;margin-top:2px;}

/* sections */
.section{padding:18px;}
.section-title{font-size:15px;color:var(--text-muted);font-weight:600;margin-bottom:10px;letter-spacing:0.2px;}

/* resultados reales */
.results-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.result-card{flex-shrink:0;width:150px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.result-imgs{display:flex;height:110px;}
.result-imgs img{width:50%;height:100%;object-fit:cover;}
.result-name{padding:8px 10px;font-size:13px;font-weight:600;}
.result-empty{color:var(--text-muted);font-size:13px;padding:14px 0;}

/* status tabs */
.tabs{display:flex;gap:8px;padding:0 18px 14px;}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}
.tab.active-activos{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
.tab.active-inscritos{background:var(--teal-dim);color:var(--teal);border-color:var(--teal);}
.tab.active-vencidos{background:var(--clay-dim);color:var(--clay);border-color:var(--clay);}

/* client list */
.client-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:0 18px 10px;}
.client-thumb{width:46px;height:46px;border-radius:50%;background:var(--surface-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:700;}
.client-thumb img{width:100%;height:100%;object-fit:cover;}
.client-info{flex:1;min-width:0;}
.client-name{font-weight:600;font-size:15px;}
.client-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-activos{background:var(--amber);} .dot-inscritos{background:var(--teal);} .dot-vencidos{background:var(--clay);}
.empty-state{color:var(--text-muted);font-size:14px;padding:20px 18px;text-align:center;}

/* buttons */
.btn-primary{background:var(--amber);color:#1A1508;font-weight:700;padding:13px 16px;border-radius:12px;font-size:14px;width:100%;}
.btn-secondary{background:var(--surface-2);color:var(--text);font-weight:600;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;}
.fab-row{padding:6px 18px 18px;}

/* link boxes */
.link-box{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;}
.link-box span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--teal);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal-overlay.center{align-items:center;}
.modal-box{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px;border-top:1px solid var(--border);}
.modal-overlay.center .modal-box{border-radius:18px;max-height:82vh;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.icon-btn{background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;}

/* form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;}
.field textarea{resize:vertical;min-height:50px;}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;}

/* detail top */
.detail-header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;}
.back-btn{background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-name{font-size:22px;}
.status-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px;}
.pill-activos{background:var(--amber-dim);color:var(--amber);} .pill-inscritos{background:var(--teal-dim);color:var(--teal);} .pill-vencidos{background:var(--clay-dim);color:var(--clay);}

.detail-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 18px;}
.dtab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;}
.dtab.active{color:var(--amber);border-bottom-color:var(--amber);}

/* macro cards */
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.macro-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
.macro-val{font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.macro-label{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* chart */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}

/* day pills */
.day-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;}
.day-pill{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-muted);}
.day-pill.active{background:var(--amber);color:#1A1508;border-color:var(--amber);}

/* meal card */
.meal-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 18px 10px;}
.meal-title{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px;}
.meal-card textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:13px;resize:none;padding:0;min-height:34px;}

/* exercise item */
.exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 18px 10px;}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-weight:700;font-size:14px;}
.ex-actions{display:flex;gap:6px;flex-shrink:0;}
.mini-icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.ex-stats{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
.ex-stats b{color:var(--text);}
.ex-media{margin-top:10px;}
.ex-media img,.ex-media video{width:100%;max-height:160px;border-radius:8px;object-fit:cover;}
.media-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);margin-top:8px;position:relative;background:transparent;padding:6px 0;}
.overlay-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.visually-hidden-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* muscle group tabs (library) */
.mg-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;}
.mg-pill{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);}
.mg-pill.active{background:var(--teal-dim);color:var(--teal);border-color:var(--teal);}
.lib-ex-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
.lib-add{width:30px;height:30px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:18px;display:flex;align-items:center;justify-content:center;}

/* photo slots */
.photo-slots{display:flex;gap:12px;padding:0 18px 18px;}
.photo-slot{flex:1;aspect-ratio:3/4;background:var(--surface);border:1px dashed var(--border);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;gap:6px;}
.photo-slot img,.photo-slot video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2;}
.photo-slot-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.55);padding:2px 8px;border-radius:8px;font-size:11px;z-index:1;font-weight:600;}

.note-banner{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);margin:0 18px 14px;line-height:1.5;}
.link-summary-section{margin-bottom:18px;}
.link-summary-title{font-size:14px;color:var(--amber);font-weight:700;margin-bottom:8px;}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:12px;font-size:13px;z-index:100;max-width:90%;box-shadow:0 6px 18px rgba(0,0,0,0.4);}

/* spinner */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);border-top-color:var(--amber);border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-primary:disabled,.btn-secondary:disabled{opacity:0.6;cursor:default;}
</style>

<script>
/* ---------------- data ---------------- */
const EXERCISE_LIBRARY_SEED = {
  "Pecho": ["Press banca plano","Press banca inclinado","Press banca declinado","Aperturas con mancuerna","Press con mancuernas","Fondos en paralelas","Flexiones de pecho","Cruce de poleas","Pull-over con mancuerna","Press en máquina Smith"],
  "Espalda": ["Dominadas","Remo con barra","Remo con mancuerna","Jalón al pecho","Remo en polea baja","Peso muerto","Pull-over en polea","Remo en máquina","Hiperextensiones","Face pull"],
  "Piernas": ["Sentadilla libre","Prensa de piernas","Zancadas","Sentadilla búlgara","Extensión de cuádriceps","Curl femoral","Peso muerto rumano","Sentadilla goblet","Elevación de talones","Hip thrust"],
  "Hombros": ["Press militar","Press con mancuernas","Elevaciones laterales","Elevaciones frontales","Pájaro (posterior)","Press Arnold","Remo al mentón","Face pull","Encogimientos de hombros","Press en máquina"],
  "Bíceps": ["Curl con barra","Curl con mancuernas","Curl martillo","Curl concentrado","Curl banco Scott","Curl en polea","Curl 21","Curl inclinado","Curl con banda","Curl spider"],
  "Tríceps": ["Press francés","Extensión en polea","Fondos entre bancos","Patada de tríceps","Press cerrado","Extensión sobre cabeza","Extensión con cuerda","Press en máquina","Fondos en paralelas","Kickback con mancuerna"],
  "Abdomen": ["Crunch abdominal","Plancha","Elevación de piernas","Abdominal en polea","Rueda abdominal","Bicicleta abdominal","Oblicuos con mancuerna","Plancha lateral","Mountain climbers","Abdominal en máquina"],
  "Glúteos": ["Hip thrust","Patada de glúteo","Puente de glúteo","Sentadilla sumo","Abducción de cadera","Zancada glútea","Peso muerto sumo","Step up","Patada trasera en polea","Puente a una pierna"]
};
const MUSCLE_GROUPS = Object.keys(EXERCISE_LIBRARY_SEED);
function buildSeedLibrary(){
  const lib={};
  MUSCLE_GROUPS.forEach(g=>{
    lib[g]=EXERCISE_LIBRARY_SEED[g].map(nombre=>({id:uid(), nombre, media:null, mediaType:null}));
  });
  return lib;
}
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MEALS = ["Desayuno","Media mañana","Almuerzo","Media tarde","Cena"];
const MEAL_SPLIT = {"Desayuno":0.25,"Media mañana":0.10,"Almuerzo":0.30,"Media tarde":0.10,"Cena":0.25};

function emptyWeekPlan(fillFn){
  const o={};
  DAYS.forEach(d=>{ o[d]=fillFn?fillFn():{}; });
  return o;
}
function emptyTrainingWeek(){
  const o={};
  DAYS.forEach(d=> o[d]=[]);
  return o;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------------------------------------------------------
   Almacenamiento persistente REAL en la nube (Firebase Firestore).
   Ya no depende del navegador ni del celular: los datos viven en
   internet, así que se puede acceder a ellos desde cualquier
   dispositivo con este mismo archivo/link.
------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyBQjL8TPnDLlXM4T2kiCFDxg-dGn40f_W4",
  authDomain: "menapit-77c5b.firebaseapp.com",
  projectId: "menapit-77c5b",
  storageBucket: "menapit-77c5b.firebasestorage.app",
  messagingSenderId: "134030608307",
  appId: "1:134030608307:web:dc6455a177a96ba69a2dc6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const storage = {
  async get(key){
    try{
      const snap = await db.collection("menapi").doc(key).get();
      if(!snap.exists) return null;
      return {key, value: snap.data().value};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      await db.collection("menapi").doc(key).set({value});
      return {key, value};
    }catch(e){ return null; }
  },
  async delete(key){
    try{ await db.collection("menapi").doc(key).delete(); return {key, deleted:true}; }
    catch(e){ return null; }
  }
};

function calcMacros(f){
  const peso=parseFloat(f.peso)||70, estatura=parseFloat(f.estatura)||170, edad=parseFloat(f.edad)||30;
  let bmr = f.sexo==="mujer" ? (10*peso+6.25*estatura-5*edad-161) : (10*peso+6.25*estatura-5*edad+5);
  const freq = parseInt(f.frecuencia)||3;
  const factor = freq<=2 ? 1.375 : (freq<=4 ? 1.55 : 1.725);
  const calorias = Math.round(bmr*factor);
  const proteina = Math.round(peso*2);
  const grasas = Math.round((calorias*0.25)/9);
  const kcalRestantes = calorias - (proteina*4) - (grasas*9);
  const carbohidratos = Math.max(0, Math.round(kcalRestantes/4));
  return {calorias,proteina,grasas,carbohidratos};
}

function generateMealPlanFallback(macros){
  return emptyWeekPlan(()=>{
    const day={};
    MEALS.forEach(m=>{
      const pct=MEAL_SPLIT[m];
      const kcal=Math.round(macros.calorias*pct);
      const prot=Math.round(macros.proteina*pct);
      const carb=Math.round(macros.carbohidratos*pct);
      const gras=Math.round(macros.grasas*pct);
      day[m] = `~${kcal} kcal · ${prot}g proteína / ${carb}g carbohidratos / ${gras}g grasas. Sugerencia: fuente de proteína magra + carbohidrato complejo + vegetales.`;
    });
    return day;
  });
}

async function generateMealPlanAI(ficha, macros){
  const prompt = `Eres un nutricionista práctico. Crea un plan de alimentación semanal (Lunes a Domingo) para esta persona:
Edad: ${ficha.edad}, sexo: ${ficha.sexo}, peso: ${ficha.peso} kg, estatura: ${ficha.estatura} cm, frecuencia de entrenamiento: ${ficha.frecuencia} veces/semana, nivel: ${ficha.nivel}, condición médica: ${ficha.condicion||"ninguna"}.
Objetivo nutricional diario aproximado: ${macros.calorias} kcal, ${macros.proteina}g proteína, ${macros.carbohidratos}g carbohidratos, ${macros.grasas}g grasas.

Reglas:
- Comidas económicas, con ingredientes fáciles de conseguir en un mercado local.
- Preparación simple, sin técnicas complicadas.
- Lenguaje claro y directo, sin tecnicismos.
- Varía las comidas entre los días para que no se repita todo igual.
- Si hay una condición médica, respétala (evita ingredientes contraindicados).
- Cada comida debe indicar brevemente qué incluye y una referencia aproximada de calorías.

Responde ÚNICAMENTE con un JSON válido, sin texto adicional, sin marcadores de código, con esta forma exacta:
{"Lunes":{"Desayuno":"texto","Media mañana":"texto","Almuerzo":"texto","Media tarde":"texto","Cena":"texto"},"Martes":{...},"Miércoles":{...},"Jueves":{...},"Viernes":{...},"Sábado":{...},"Domingo":{...}}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:3000,
      messages:[{role:"user", content:prompt}]
    })
  });
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||"").join("");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean);
  DAYS.forEach(d=>{
    if(!parsed[d]) throw new Error("respuesta incompleta");
    MEALS.forEach(m=>{ if(!parsed[d][m]) parsed[d][m]=""; });
  });
  return parsed;
}

function showToast(msg){
  const old=document.querySelector(".toast"); if(old) old.remove();
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4000);
}

/* ---------------- persistencia ---------------- */
async function persistTrainer(){
  try{
    const light = {name: state.trainer.name};
    await storage.set("trainer", JSON.stringify(light), false);
  }catch(e){ showToast("No se pudo guardar tu perfil."); }
}
async function persistClient(c){
  try{
    const light = JSON.parse(JSON.stringify(c));
    light.fotoAntes=null; light.fotoDespues=null;
    DAYS.forEach(d=>{ light.planEntrenamiento[d].forEach(ex=>{ ex.media=null; ex.mediaType=null; }); });
    await storage.set("client:"+c.id, JSON.stringify(light), false);
  }catch(e){ showToast("No se pudo guardar los cambios de "+c.nombre+"."); }
}
async function persistClientIds(){
  try{ await storage.set("client-ids", JSON.stringify(state.clients.map(c=>c.id)), false); }
  catch(e){ showToast("No se pudo actualizar la lista de clientes."); }
}
async function deleteClientStorage(id){
  try{ await storage.delete("client:"+id, false); }catch(e){}
}
async function persistLibraryMeta(){
  try{
    const meta={};
    MUSCLE_GROUPS.forEach(g=>{
      meta[g]=state.library[g].map(it=>({id:it.id, nombre:it.nombre, mediaType:it.mediaType, hasMedia:!!it.media}));
    });
    await storage.set("library", JSON.stringify(meta), false);
  }catch(e){ showToast("No se pudo guardar la biblioteca."); }
}

const MAX_VIDEO_BYTES = 500*1024; // Firestore permite máx. ~1MB por registro; los videos no se comprimen, así que el margen real es muy chico
const MAX_OUTPUT_DATAURL_CHARS = 850*1024; // margen de seguridad bajo el límite de 1MB por documento de Firestore

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("no se pudo leer la imagen"));
    reader.onload=()=>{
      img.onerror=()=>reject(new Error("imagen inválida"));
      img.onload=()=>{
        let w=img.width, h=img.height;
        const maxSide=800;
        if(w>maxSide || h>maxSide){
          if(w>h){ h=Math.round(h*(maxSide/w)); w=maxSide; }
          else{ w=Math.round(w*(maxSide/h)); h=maxSide; }
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        let quality=0.75, out=canvas.toDataURL("image/jpeg", quality);
        while(out.length>MAX_OUTPUT_DATAURL_CHARS && quality>0.25){
          quality-=0.1;
          out=canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function fileToDataUrlChecked(file, cb){
  const isVideo = file.type.startsWith("video");
  if(isVideo){
    if(file.size > MAX_VIDEO_BYTES){
      showToast("Los videos todavía no caben en el almacenamiento actual (máx. ~"+Math.round(MAX_VIDEO_BYTES/1024)+"KB, muy poco para un video real). Usa una foto por ahora — para videos necesitamos activar otro almacenamiento más adelante.");
      return;
    }
    fileToDataUrl(file, cb);
  }else{
    compressImage(file).then(dataUrl=>cb(dataUrl,"image"))
      .catch(()=>showToast("No se pudo procesar esa imagen, intenta con otra."));
  }
}

/* ---------------- persistencia de medios (cada uno en su propia clave) ---------------- */
async function persistMedia(key, dataUrl, mediaType){
  try{
    const ok = await storage.set("media:"+key, JSON.stringify({dataUrl,mediaType}), false);
    if(!ok) showToast("El archivo es muy pesado para guardarse, prueba con uno más liviano.");
  }catch(e){ showToast("No se pudo guardar ese archivo."); }
}
async function loadMedia(key){
  try{
    const r = await storage.get("media:"+key, false);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* no hay medio guardado para esta clave */ }
  return null;
}
async function deleteMedia(key){
  try{ await storage.delete("media:"+key, false); }catch(e){}
}

  const g=id=>document.getElementById(id).value;
  const ficha={ nombre:g("f_nombre")||"Nuevo cliente", edad:g("f_edad"), sexo:g("f_sexo"), peso:g("f_peso"), estatura:g("f_estatura"), frecuencia:g("f_frecuencia"), nivel:g("f_nivel"), condicion:g("f_condicion") };

  state.modal={type:"generando"};

  let plan;
  try{
    plan = await generateMealPlanAI(ficha, macros);
  }catch(e){
    plan = generateMealPlanFallback(macros);
    showToast("La IA no respondió a tiempo, se generó un plan base. Puedes regenerarlo luego desde la ficha.");
  }

  const cliente={
    id:uid(), nombre:ficha.nombre, estado:"inscritos",
    ficha:{edad:ficha.edad,peso:ficha.peso,estatura:ficha.estatura,sexo:ficha.sexo,frecuencia:ficha.frecuencia,nivel:ficha.nivel,condicion:ficha.condicion},
    macros, pesoHistorial:[{fecha:"Hoy", peso: parseFloat(ficha.peso)||0}],
    fotoAntes:null, fotoDespues:null,
    planAlimentacion: plan,
    planEntrenamiento: emptyTrainingWeek()
  };
  state.clients.push(cliente);
  await persistClient(cliente);
  await persistClientIds();
  state.modal=null;
  state.view.statusTab="inscritos";
  render();
}

async function regenerarPlanIA(clientId){
  const c=getClient(clientId);
  state.modal={type:"generando"};
  render();
  try{
    c.planAlimentacion = await generateMealPlanAI(c.ficha, c.macros);
    showToast("Plan de alimentación regenerado con IA.");
  }catch(e){
    showToast("No se pudo contactar a la IA, intenta de nuevo en un momento.");
  }
  await persistClient(c);
  state.modal=null;
  render();
}

    item.media=url; item.mediaType=type;
    persistMedia("lib:"+id, url, type);
    persistLibraryMeta();
    render();
  });

  const ficha={edad:"27",peso:"68",estatura:"165",sexo:"mujer",frecuencia:"4",nivel:"Intermedio",condicion:"Ninguna"};

  const c = {

    ficha, macros,
    pesoHistorial:[{fecha:"01 Ago",peso:72},{fecha:"15 Ago",peso:70.5},{fecha:"01 Sep",peso:69},{fecha:"04 Sep",peso:68}],

    planEntrenamiento: emptyTrainingWeek()
  };

  await persistClientIds();
}

async function initApp(){
  try{
    const trainerRes = await storage.get("trainer", false);
    if(trainerRes && trainerRes.value){
      const t=JSON.parse(trainerRes.value);
      state.trainer.name = t.name || state.trainer.name;
    }
  }catch(e){ /* sin perfil guardado aún */ }
  const trainerMedia = await loadMedia("trainer-avatar");
  if(trainerMedia){ state.trainer.media=trainerMedia.dataUrl; state.trainer.mediaType=trainerMedia.mediaType; }

  try{
    const libRes = await storage.get("library", false);
    if(libRes && libRes.value){
      const meta = JSON.parse(libRes.value);
      for(const g of MUSCLE_GROUPS){
        state.library[g] = [];
        for(const it of (meta[g]||[])){
          const entry = {id:it.id, nombre:it.nombre, media:null, mediaType:it.mediaType||null};
          if(it.hasMedia){
            const m = await loadMedia("lib:"+it.id);
            if(m) entry.media = m.dataUrl;
          }
          state.library[g].push(entry);
        }
      }
    }else{
      state.library = buildSeedLibrary();
      await persistLibraryMeta();
    }
  }catch(e){
    state.library = buildSeedLibrary();
  }

  let ids=[];
  try{
    const idsRes = await storage.get("client-ids", false);
    if(idsRes && idsRes.value) ids = JSON.parse(idsRes.value);
  }catch(e){ /* primera vez, sin clientes guardados */ }

  if(ids.length===0){
    await seedDemoClient();
  }else{
    for(const id of ids){
      try{
        const r = await storage.get("client:"+id, false);
        if(r && r.value){
          const c = JSON.parse(r.value);
          const fa = await loadMedia(id+":foto:fotoAntes"); if(fa) c.fotoAntes=fa.dataUrl;
          const fd = await loadMedia(id+":foto:fotoDespues"); if(fd) c.fotoDespues=fd.dataUrl;
          for(const d of DAYS){
            for(const ex of c.planEntrenamiento[d]){
              if(ex.instId){
                const em = await loadMedia(id+":ex:"+ex.instId);
                if(em){ ex.media=em.dataUrl; ex.mediaType=em.mediaType; }
              }
            }
          }
          state.clients.push(c);
        }
      }catch(e){ /* ese cliente no se pudo cargar, se omite */ }
    }
  }

  state.modal=null;
  render();
}

initApp();
</script>
